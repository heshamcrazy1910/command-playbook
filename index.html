<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفتر الأوامر والتجارب السريعة | Quick Command Playbook</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink:        '#0a0a14',
                        surface:    '#0f0f1e',
                        panel:      'rgba(255, 255, 255, 0.04)',
                        line:       'rgba(255, 255, 255, 0.09)',
                        fg:         '#eef0f7',
                        muted:      '#9a9ab5',
                        primary:    '#7c5cff',
                        secondary:  '#00d4ff',
                        accent:     '#ff3d8b',
                    },
                    fontFamily: {
                        sans: ['Cairo', 'system-ui', 'sans-serif'],
                        mono: ['"Fira Code"', 'monospace'],
                    },
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-ink text-fg min-h-screen flex flex-col">

    <header class="border-b border-line bg-surface/70 backdrop-blur-xl sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-br from-primary/25 to-accent/20 text-primary p-2.5 rounded-xl border border-primary/30 shadow-lg shadow-primary/20">
                    <i class="fa-solid fa-terminal text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-fg flex items-center gap-2">
                        دفتر الأوامر السريعة
                        <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-primary/10 text-primary border border-primary/30">Playbook</span>
                    </h1>
                    <p class="text-xs text-muted">مرجعك المنظم للأوامر والحلول الشائعة</p>
                </div>
            </div>

            <!-- أزرار التحكم -->
            <div class="flex items-center gap-2">
                <!-- تصدير -->
                <button onclick="exportNotes()" title="تصدير نسخة احتياطية" class="bg-surface hover:bg-white/10 text-fg border border-line font-semibold text-sm px-3 py-2.5 rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-download text-primary"></i>
                    <span class="hidden sm:inline">تصدير</span>
                </button>
                
                <!-- استيراد -->
                <button onclick="triggerImport()" title="استيراد نسخة احتياطية" class="bg-surface hover:bg-white/10 text-fg border border-line font-semibold text-sm px-3 py-2.5 rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-upload text-secondary"></i>
                    <span class="hidden sm:inline">استيراد</span>
                </button>
                
                <!-- حقل مخفي لاختيار الملف -->
                <input type="file" id="importFile" accept=".json" class="hidden" onchange="importNotes(event)">

                <!-- إضافة ملاحظة -->
                <button onclick="openModal()" class="bg-gradient-to-r from-primary to-accent hover:brightness-110 text-white font-semibold text-sm px-4 py-2.5 rounded-xl transition shadow-lg shadow-primary/40 hover:shadow-primary/60 flex items-center gap-2">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span class="hidden sm:inline">إضافة ملاحظة جديدة</span>
                    <span class="sm:hidden">جديد</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
        <div class="flex flex-col md:flex-row gap-4 justify-between items-center bg-surface/50 p-4 rounded-2xl border border-line backdrop-blur-sm">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-3.5 text-muted text-sm"></i>
                <input type="text" id="searchInput" onkeyup="filterCards()" placeholder="ابحث باسم الملاحظة، أو كود المساعد..." class="w-full bg-ink border border-line text-fg placeholder-muted/70 text-sm rounded-xl pr-10 pl-4 py-2.5 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition">
            </div>
            <div class="flex flex-wrap gap-2 w-full md:w-auto" id="categoryFilters"></div>
        </div>

        <div id="notesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </main>

    <!-- Modal -->
    <div id="noteModal" class="fixed inset-0 bg-ink/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-surface border border-line rounded-2xl w-full max-w-xl p-6 space-y-4 shadow-2xl shadow-primary/10">
            <div class="flex justify-between items-center border-b border-line pb-3">
                <h3 class="text-lg font-bold text-fg flex items-center gap-2">
                    <i class="fa-regular fa-bookmark text-primary"></i>
                    <span id="modalTitle">إضافة ملاحظة أوامر جديدة</span>
                </h3>
                <button onclick="closeModal()" class="text-muted hover:text-accent transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="addNoteForm" onsubmit="saveNote(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-muted mb-1">عنوان الملاحظة</label>
                    <input type="text" id="noteTitle" required placeholder="مثال: تخطي إيميل مايكروسوفت في Windows 11" class="w-full bg-ink border border-line rounded-xl px-3.5 py-2 text-sm text-fg placeholder-muted/60 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-muted mb-1">التصنيف</label>
                        <select id="noteCategory" class="w-full bg-ink border border-line rounded-xl px-3.5 py-2 text-sm text-fg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-muted mb-1">وصف مختصر (اختياري)</label>
                        <input type="text" id="noteDesc" placeholder="تجاوز تسجيل الدخول الإجباري" class="w-full bg-ink border border-line rounded-xl px-3.5 py-2 text-sm text-fg placeholder-muted/60 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-muted mb-1">الأوامر / الكود (كل أمر في سطر منفصل)</label>
                    <textarea id="noteCommands" rows="5" required placeholder="OOBE\BYPASSNRO&#10;netsh interface set interface name=&quot;Wi-Fi&quot; admin=disabled" class="w-full bg-black/50 border border-line rounded-xl p-3 text-sm text-secondary code-font placeholder-muted/40 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition" dir="ltr"></textarea>
                </div>

                <div class="flex justify-end gap-3 border-t border-line pt-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-muted hover:bg-white/5 hover:text-fg transition">إلغاء</button>
                    <button type="submit" id="submitBtn" class="px-5 py-2 rounded-xl text-xs font-semibold bg-gradient-to-r from-primary to-accent hover:brightness-110 text-white transition shadow-lg shadow-primary/30">حفظ الملاحظة</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 left-6 bg-gradient-to-l from-primary to-accent text-white px-4 py-2.5 rounded-xl shadow-xl shadow-primary/40 border border-primary/40 text-sm font-semibold flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <i class="fa-solid fa-check-circle"></i>
        <span id="toastMsg">تم النسخ إلى الحافظة!</span>
    </div>

    <script src="categories.js"></script>
    <script src="app.js"></script>
</body>
</html>
